<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公平派單系統</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
body { font-family: -apple-system, sans-serif; padding: 16px; background: #f5f7fa; }
.card { background: white; border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
#status { padding: 12px; border-radius: 8px; background: #fff3cd; margin-bottom: 12px; }
.error { background: #f8d7da; color: #721c24; }
button { background: #1a73e8; color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; margin-top: 8px; }
</style>
</head>
<body>
<div id="status">載入中...</div>
<div class="card">
  <h2>🚚 公平派單系統</h2>
  <p id="info">等待 LIFF 初始化...</p>
</div>
<div class="card" id="mainContent" style="display:none;">
  <p>系統已載入</p>
  <button onclick="testFirebase()">測試連線</button>
</div>

<script type="module">
const statusEl = document.getElementById('status');
const infoEl = document.getElementById('info');

function showStatus(msg, isError = false) {
  statusEl.textContent = msg;
  statusEl.className = isError ? 'error' : '';
  statusEl.style.display = 'block';
}

async function init() {
  try {
    showStatus('正在初始化 LIFF...');
    await liff.init({ liffId: "2012126765-B8WhFSkh" });
    showStatus('LIFF 初始化成功');

    if (!liff.isLoggedIn()) {
      showStatus('尚未登入，正在導向登入...');
      liff.login();
      return;
    }

    const profile = await liff.getProfile();
    infoEl.textContent = `已登入：${profile.displayName}`;
    document.getElementById('mainContent').style.display = 'block';
    showStatus('載入完成');

  } catch (err) {
    showStatus('錯誤：' + err.message, true);
    infoEl.textContent = JSON.stringify(err);
  }
}

init();
</script>
</body>
</html>
