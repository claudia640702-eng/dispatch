<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生活佳派單系統</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif; background: #f5f7fa; color: #333; padding: 12px; max-width: 640px; margin: 0 auto; }
h1 { font-size: 1.4rem; margin-bottom: 6px; color: #1a73e8; }
h2 { font-size: 1.15rem; margin: 14px 0 8px; color: #444; }
.card { background: white; border-radius: 12px; padding: 14px; margin-bottom: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
input, textarea, select { width: 100%; padding: 10px; margin-top: 4px; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; }
button { background: #1a73e8; color: white; border: none; padding: 12px 16px; border-radius: 8px; font-size: 1rem; cursor: pointer; margin-top: 8px; width: 100%; }
button.secondary { background: #34a853; }
button.danger { background: #ea4335; }
button.warning { background: #fbbc04; color: #333; }
button.gray { background: #666; }
button.small-btn { width: auto; padding: 6px 10px; margin: 0 2px; font-size: 0.85rem; }
.driver-item, .order-item { padding: 10px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
.suggestion { background: #e8f0fe; padding: 12px; border-radius: 8px; margin: 8px 0; font-weight: bold; text-align: center; }
.hidden { display: none; }
.small { font-size: 0.85rem; color: #666; }
.flex { display: flex; gap: 8px; flex-wrap: wrap; }
.flex button { flex: 1; min-width: 80px; }
.status-online { color: #34a853; font-weight: bold; }
.status-offline { color: #ea4335; }
.shift-tag { display: inline-block; background: #f1f3f4; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; margin-left: 6px; }
.pending-tag { color: #f57c00; font-size: 0.75rem; font-weight: bold; }
.accepted-tag { color: #2e7d32; font-size: 0.75rem; font-weight: bold; }
.timeout-tag { color: #d32f2f; font-size: 0.75rem; font-weight: bold; }
.completed-tag { color: #666; font-size: 0.75rem; font-weight: bold; }
.reservation-tag { color: #7b1fa2; font-size: 0.75rem; font-weight: bold; }
.me-tag { background: #e8f5e9; color: #2e7d32; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; }
.my-order { background: #e8f5e9 !important; }
.queue-tag { font-size: 0.75rem; color: #1a73e8; margin-left: 6px; }
.note { color: #555; font-size: 0.85rem; margin-top: 4px; }
.stats { font-size: 0.8rem; color: #555; margin-top: 2px; }
#status { padding: 10px; border-radius: 8px; background: #fff3cd; margin-bottom: 10px; font-size: 0.9rem; }
.lock-overlay { background: #fff; border: 2px dashed #ddd; border-radius: 12px; padding: 20px; text-align: center; }
</style>
</head>
<body>
<div id="status">載入中...</div>
<h1>🚚 生活佳派單系統</h1>
<p class="small" id="userInfo"></p>

<div class="card">
  <h2>我的狀態（司機用）</h2>
  <select id="myDriverSelect"><option value="">選擇我是誰</option></select>
  <button id="toggleMyStatusBtn" class="secondary">上線</button>
</div>

<div class="card" id="myOrdersCard" style="display:none;">
  <h2>我的待接訂單</h2>
  <div id="myPendingOrders"></div>
</div>

<div class="card">
  <h2>預約單（誰先接就歸誰）</h2>
  <div id="reservationOrders"></div>
</div>

<div class="card">
  <h2>司機上線狀態（即時）</h2>
  <div id="driversList"></div>
  <div style="margin-top:10px;">
    <input type="text" id="newDriverName" placeholder="新增司機姓名（店家用）">
    <select id="newDriverShift">
      <option value="all">全天</option>
      <option value="morning">早班</option>
      <option value="evening">晚班</option>
      <option value="flexible">彈性</option>
    </select>
    <button id="addDriverBtn">新增司機</button>
  </div>
</div>

<div class="card" id="ownerSection">
  <div id="ownerLock" class="lock-overlay">
    <p>🔒 店家功能已鎖定</p>
    <input type="password" id="ownerPin" placeholder="輸入密碼解鎖" style="margin:10px 0;">
    <button id="unlockBtn">解鎖</button>
  </div>
  <div id="ownerContent" class="hidden">
    <h2>新增訂單（店家用）</h2>
    <textarea id="orderContent" rows="3" placeholder="訂單內容 / 地址"></textarea>
    <input type="text" id="orderNote" placeholder="備註（選填）">
    <button id="suggestBtn">建議派單</button>
    <button id="createReservationBtn" class="warning">建立預約單（不指定司機）</button>
    <div id="suggestionBox" class="suggestion hidden"></div>
    <div id="assignButtons" class="flex hidden">
      <button id="confirmAssignBtn" class="secondary">確認派單</button>
      <button id="manualAssignBtn" class="gray">手動選擇</button>
    </div>
    <div id="manualSelect" class="hidden">
      <select id="driverSelect"></select>
      <button id="assignSelectedBtn">派給選中司機</button>
    </div>
  </div>
</div>

<div class="card">
  <h2>目前輪流順序</h2>
  <div id="queueList"></div>
</div>

<div class="card">
  <h2>所有訂單狀態</h2>
  <div id="activeOrders"></div>
</div>

<div class="card">
  <h2>已完成訂單</h2>
  <div id="completedOrders"></div>
  <button id="clearCompletedBtn" class="danger" style="margin-top:12px;">一鍵清除已完成訂單</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, doc, setDoc, updateDoc, deleteDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCylh0Kd3LsRt9k6hipcFpUdr40KG_kjTw",
  authDomain: "liveinjiali.firebaseapp.com",
  projectId: "liveinjiali",
  storageBucket: "liveinjiali.firebasestorage.app",
  messagingSenderId: "757070771946",
  appId: "1:757070771946:web:42ded7850149b74448c993",
  measurementId: "G-4L9EZSGGTJ"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const OWNER_PIN = "8561";

let drivers = [];
let orders = [];
let nextOrderId = 1;
let myDriverId = localStorage.getItem('myDriverId') || null;
let currentQueueIndex = 0;
let isOwnerUnlocked = sessionStorage.getItem('ownerUnlocked') === 'true';
const TIMEOUT_MS = 3 * 60 * 1000;

function showStatus(msg) {
  document.getElementById('status').textContent = msg;
}

function updateOwnerUI() {
  if (isOwnerUnlocked) {
    document.getElementById('ownerLock').classList.add('hidden');
    document.getElementById('ownerContent').classList.remove('hidden');
  } else {
    document.getElementById('ownerLock').classList.remove('hidden');
    document.getElementById('ownerContent').classList.add('hidden');
  }
}

async function initLiff() {
  try {
    showStatus('正在初始化 LIFF...');
    await liff.init({ liffId: "2012126765-B8WhFSkh" });
    if (!liff.isLoggedIn()) {
      liff.login();
      return;
    }
    const profile = await liff.getProfile();
    document.getElementById('userInfo').textContent = `已登入：${profile.displayName}`;
    showStatus('載入完成');
    updateOwnerUI();
    listenData();
    bindEvents();
  } catch (e) {
    showStatus('LIFF 錯誤：' + e.message);
  }
}

function shiftLabel(s) {
  return { morning: '早班', evening: '晚班', all: '全天', flexible: '彈性' }[s] || s;
}

function isTimedOut(order) {
  if (order.status !== 'pending' || !order.assignedAt) return false;
  return Date.now() - new Date(order.assignedAt).getTime() > TIMEOUT_MS;
}

function listenData() {
  onSnapshot(collection(db, 'drivers'), (snap) => {
    drivers = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  });
  onSnapshot(query(collection(db, 'orders'), orderBy('createdAt', 'desc')), (snap) => {
    orders = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (orders.length) {
      const maxId = Math.max(...orders.map(o => parseInt(o.orderNumber) || 0));
      nextOrderId = maxId + 1;
    }
    render();
  });
}

function bindEvents() {
  document.getElementById('unlockBtn').onclick = unlockOwner;
  document.getElementById('addDriverBtn').onclick = addDriver;
  document.getElementById('toggleMyStatusBtn').onclick = toggleMyStatus;
  document.getElementById('suggestBtn').onclick = suggestAssignment;
  document.getElementById('createReservationBtn').onclick = createReservation;
  document.getElementById('confirmAssignBtn').onclick = confirmAssign;
  document.getElementById('manualAssignBtn').onclick = manualAssign;
  document.getElementById('assignSelectedBtn').onclick = assignToSelected;
  document.getElementById('clearCompletedBtn').onclick = clearCompletedOrders;
}

function unlockOwner() {
  const pin = document.getElementById('ownerPin').value;
  if (pin === OWNER_PIN) {
    isOwnerUnlocked = true;
    sessionStorage.setItem('ownerUnlocked', 'true');
    updateOwnerUI();
    render();
    document.getElementById('ownerPin').value = '';
  } else {
    alert('密碼錯誤');
  }
}

async function addDriver() {
  const name = document.getElementById('newDriverName').value.trim();
  const shift = document.getElementById('newDriverShift').value;
  if (!name) return alert('請輸入姓名');
  try {
    const id = Date.now().toString();
    await setDoc(doc(db, 'drivers', id), {
      name, shift, status: 'offline', onlineAt: null
    });
    document.getElementById('newDriverName').value = '';
    alert('已新增司機：' + name);
  } catch (err) {
    alert('新增失敗：' + err.message);
  }
}

async function deleteDriver(driverId) {
  if (!isOwnerUnlocked) return alert('請先解鎖店家功能');
  const driver = drivers.find(d => d.id === driverId);
  if (!driver) return;
  if (!confirm(`確定要刪除司機「${driver.name}」嗎？此動作無法復原。`)) return;
  try {
    await deleteDoc(doc(db, 'drivers', driverId));
    alert(`已刪除司機：${driver.name}`);
  } catch (err) {
    alert('刪除失敗：' + err.message);
  }
}

async function toggleMyStatus() {
  if (!myDriverId) return alert('請先選擇你是誰');
  const driver = drivers.find(d => d.id === myDriverId);
  if (!driver) return;
  const newStatus = driver.status === 'online' ? 'offline' : 'online';
  const update = { status: newStatus };
  if (newStatus === 'online') update.onlineAt = new Date().toISOString();
  try {
    await updateDoc(doc(db, 'drivers', myDriverId), update);
  } catch (err) {
    alert('更新狀態失敗：' + err.message);
  }
}

function getOnlineDriversSorted() {
  return drivers
    .filter(d => d.status === 'online')
    .sort((a, b) => {
      const aTime = a.onlineAt ? new Date(a.onlineAt).getTime() : 0;
      const bTime = b.onlineAt ? new Date(b.onlineAt).getTime() : 0;
      return aTime - bTime;
    });
}

function getNextDriver(excludeId = null) {
  const online = getOnlineDriversSorted().filter(d => d.id !== excludeId);
  if (!online.length) return null;
  if (currentQueueIndex >= online.length) currentQueueIndex = 0;
  const next = online[currentQueueIndex];
  currentQueueIndex = (currentQueueIndex + 1) % online.length;
  return next;
}

function getDriverStats(driverId) {
  const driverName = drivers.find(d => d.id === driverId)?.name;
  const completed = orders.filter(o => o.driverId === driverId && o.status === 'completed').length;
  const rejected = orders.filter(o => (o.rejectedBy || []).includes(driverName)).length;
  const pending = orders.filter(o => o.driverId === driverId && o.status === 'pending').length;
  return { completed, rejected, pending };
}

let suggested = null;
let pending = null;

function suggestAssignment() {
  if (!isOwnerUnlocked) return alert('請先解鎖店家功能');
  const content = document.getElementById('orderContent').value.trim();
  if (!content) return alert('請輸入訂單內容');
  const next = getNextDriver();
  if (!next) return alert('目前沒有司機上線');
  suggested = next;
  pending = { content, note: document.getElementById('orderNote').value.trim() };
  document.getElementById('suggestionBox').innerHTML = `建議派給：<strong>${suggested.name}</strong>（輪流順序）`;
  document.getElementById('suggestionBox').classList.remove('hidden');
  document.getElementById('assignButtons').classList.remove('hidden');
}

async function createReservation() {
  if (!isOwnerUnlocked) return alert('請先解鎖店家功能');
  const content = document.getElementById('orderContent').value.trim();
  if (!content) return alert('請輸入訂單內容');
  const note = document.getElementById('orderNote').value.trim();
  const orderNumber = nextOrderId++;
  const now = new Date().toISOString();
  const orderData = {
    orderNumber, content, note: note || '',
    driverId: null, driverName: null,
    status: 'reservation',
    createdAt: now, assignedAt: null, acceptedAt: null,
    rejectedBy: []
  };
  try {
    await setDoc(doc(db, 'orders', Date.now().toString()), orderData);
    document.getElementById('orderContent').value = '';
    document.getElementById('orderNote').value = '';
    alert('已建立預約單');
  } catch (err) {
    alert('建立失敗：' + err.message);
  }
}

async function confirmAssign() {
  if (!isOwnerUnlocked) return;
  if (!suggested || !pending) return;
  await assignOrder(suggested.id, pending.content, pending.note);
  clearPending();
}

function manualAssign() {
  if (!isOwnerUnlocked) return;
  const online = getOnlineDriversSorted();
  const sel = document.getElementById('driverSelect');
  sel.innerHTML = online.map(d => `<option value="${d.id}">${d.name}</option>`).join('');
  document.getElementById('manualSelect').classList.remove('hidden');
}

async function assignToSelected() {
  if (!isOwnerUnlocked) return;
  const id = document.getElementById('driverSelect').value;
  if (!id || !pending) return;
  await assignOrder(id, pending.content, pending.note);
  clearPending();
}

function clearPending() {
  document.getElementById('orderContent').value = '';
  document.getElementById('orderNote').value = '';
  document.getElementById('suggestionBox').classList.add('hidden');
  document.getElementById('assignButtons').classList.add('hidden');
  document.getElementById('manualSelect').classList.add('hidden');
  pending = null;
  suggested = null;
}

async function assignOrder(driverId, content, note, existingId = null) {
  const driver = drivers.find(d => d.id === driverId);
  if (!driver) return;
  const orderNumber = existingId ? (orders.find(o => o.id === existingId)?.orderNumber || nextOrderId++) : nextOrderId++;
  const now = new Date().toISOString();
  const orderData = {
    orderNumber, content, note: note || '', driverId, driverName: driver.name,
    status: 'pending', assignedAt: now, createdAt: now, acceptedAt: null,
    rejectedBy: existingId ? (orders.find(o => o.id === existingId)?.rejectedBy || []) : []
  };
  const orderRef = existingId ? doc(db, 'orders', existingId) : doc(db, 'orders', Date.now().toString());
  try {
    await setDoc(orderRef, orderData);
    alert(`已派給 ${driver.name}（待接單）`);
  } catch (err) {
    alert('派單失敗：' + err.message);
  }
}

async function claimReservation(orderId) {
  if (!myDriverId) return alert('請先選擇你是誰並上線');
  const driver = drivers.find(d => d.id === myDriverId);
  if (!driver || driver.status !== 'online') return alert('請先上線才能接預約單');
  const order = orders.find(o => o.id === orderId);
  if (!order || order.status !== 'reservation') return alert('這筆預約單已被接走');
  try {
    await updateDoc(doc(db, 'orders', orderId), {
      driverId: myDriverId,
      driverName: driver.name,
      status: 'accepted',
      acceptedAt: new Date().toISOString(),
      assignedAt: new Date().toISOString()
    });
    alert('已接單！');
  } catch (err) {
    alert('接單失敗：' + err.message);
  }
}

async function acceptOrder(orderId) {
  const order = orders.find(o => o.id === orderId);
  if (!order) return;
  if (order.driverId !== myDriverId) return alert('這不是派給你的訂單');
  if (isTimedOut(order)) return alert('已超過 3 分鐘，無法再接單');
  try {
    await updateDoc(doc(db, 'orders', orderId), { status: 'accepted', acceptedAt: new Date().toISOString() });
    alert('已接單！');
  } catch (err) {
    alert('接單失敗：' + err.message);
  }
}

async function rejectOrder(orderId) {
  if (!isOwnerUnlocked) return alert('請先解鎖店家功能才能轉派');
  const order = orders.find(o => o.id === orderId);
  if (!order || !confirm('確定拒絕 / 轉派這筆？')) return;
  try {
    const rejectedBy = [...(order.rejectedBy || []), order.driverName || '未知'];
    await updateDoc(doc(db, 'orders', orderId), { status: 'rejected', driverId: null, driverName: null, rejectedBy });
    const next = getNextDriver(order.driverId);
    if (next && confirm(`建議轉派給 ${next.name}？`)) {
      await assignOrder(next.id, order.content, order.note, orderId);
    }
  } catch (err) {
    alert('轉派失敗：' + err.message);
  }
}

async function completeOrder(id) {
  try {
    await updateDoc(doc(db, 'orders', id), { status: 'completed', completedAt: new Date().toISOString() });
  } catch (err) {
    alert('完成失敗：' + err.message);
  }
}

async function cancelOrder(id) {
  if (!isOwnerUnlocked) return alert('請先解鎖店家功能');
  if (!confirm('取消訂單？')) return;
  try {
    await updateDoc(doc(db, 'orders', id), { status: 'cancelled' });
  } catch (err) {
    alert('取消失敗：' + err.message);
  }
}

async function clearCompletedOrders() {
  if (!isOwnerUnlocked) return alert('請先解鎖店家功能');
  if (!confirm('確定清除所有已完成訂單？此動作無法復原。')) return;
  try {
    const completed = orders.filter(o => o.status === 'completed');
    for (const o of completed) {
      await deleteDoc(doc(db, 'orders', o.id));
    }
    alert(`已清除 ${completed.length} 筆已完成訂單`);
  } catch (err) {
    alert('清除失敗：' + err.message);
  }
}

function statusLabel(order) {
  if (order.status === 'reservation') return '<span class="reservation-tag">預約單</span>';
  if (order.status === 'pending' && isTimedOut(order)) return '<span class="timeout-tag">超時未接</span>';
  if (order.status === 'pending') return '<span class="pending-tag">待接單</span>';
  if (order.status === 'accepted') return '<span class="accepted-tag">已接單</span>';
  if (order.status === 'rejected') return '<span class="timeout-tag">待轉派</span>';
  if (order.status === 'completed') return '<span class="completed-tag">已完成</span>';
  return order.status;
}

function render() {
  const sel = document.getElementById('myDriverSelect');
  const current = sel.value || myDriverId;
  sel.innerHTML = '<option value="">選擇我是誰</option>' + drivers.map(d => `<option value="${d.id}" ${d.id === current ? 'selected' : ''}>${d.name}</option>`).join('');
  sel.onchange = () => {
    myDriverId = sel.value;
    localStorage.setItem('myDriverId', myDriverId);
    updateMyButton();
    render();
  };
  updateMyButton();

  const myPending = orders.filter(o => o.status === 'pending' && o.driverId === myDriverId && !isTimedOut(o));
  const myCard = document.getElementById('myOrdersCard');
  if (myPending.length && myDriverId) {
    myCard.style.display = 'block';
    document.getElementById('myPendingOrders').innerHTML = myPending.map(o => `
      <div class="order-item my-order">
        <div>
          <strong>#${o.orderNumber}</strong> ${statusLabel(o)}<br>
          <span class="small">${o.content}</span>
          ${o.note ? `<div class="note">備註：${o.note}</div>` : ''}
        </div>
        <div>
          <button class="secondary small-btn" data-action="accept" data-id="${o.id}">接單</button>
          <button class="warning small-btn" data-action="reject" data-id="${o.id}">拒絕</button>
        </div>
      </div>
    `).join('');
    document.getElementById('myPendingOrders').onclick = (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;
      if (btn.dataset.action === 'accept') acceptOrder(btn.dataset.id);
      if (btn.dataset.action === 'reject') rejectOrder(btn.dataset.id);
    };
  } else {
    myCard.style.display = 'none';
  }

  const reservations = orders.filter(o => o.status === 'reservation');
  document.getElementById('reservationOrders').innerHTML = reservations.length ? reservations.map(o => `
    <div class="order-item">
      <div>
        <strong>#${o.orderNumber}</strong> ${statusLabel(o)}<br>
        <span class="small">${o.content}</span>
        ${o.note ? `<div class="note">備註：${o.note}</div>` : ''}
      </div>
      <div>
        <button class="secondary small-btn" data-action="claim" data-id="${o.id}">我要接</button>
      </div>
    </div>
  `).join('') : '<p class="small">目前無預約單</p>';

  document.getElementById('reservationOrders').onclick = (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    if (btn.dataset.action === 'claim') claimReservation(btn.dataset.id);
  };

  const onlineSorted = getOnlineDriversSorted();
  document.getElementById('driversList').innerHTML = drivers.map(d => {
    const stats = getDriverStats(d.id);
    return `
    <div class="driver-item">
      <div>
        <strong>${d.name}</strong> <span class="shift-tag">${shiftLabel(d.shift)}</span>
        ${d.id === myDriverId ? '<span class="me-tag">我</span>' : ''}
        <div class="small">
          <span class="${d.status === 'online' ? 'status-online' : 'status-offline'}">${d.status === 'online' ? '● 上線' : '○ 離線'}</span>
          ${d.status === 'online' && d.onlineAt ? `<span class="queue-tag">第 ${onlineSorted.findIndex(x => x.id === d.id) + 1} 順位</span>` : ''}
        </div>
        <div class="stats">已完成 ${stats.completed}　拒絕 ${stats.rejected}　未接 ${stats.pending}</div>
      </div>
      ${isOwnerUnlocked ? `<button class="danger small-btn" data-action="deleteDriver" data-id="${d.id}">刪除</button>` : ''}
    </div>`;
  }).join('') || '<p class="small">尚無司機</p>';

  document.getElementById('driversList').onclick = (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    if (btn.dataset.action === 'deleteDriver') deleteDriver(btn.dataset.id);
  };

  document.getElementById('queueList').innerHTML = onlineSorted.length ? onlineSorted.map((d, i) => `
    <div style="padding:6px 0; border-bottom:1px solid #eee;">
      ${i + 1}. <strong>${d.name}</strong>
      ${i === (currentQueueIndex % onlineSorted.length) ? ' ← 下一單' : ''}
    </div>
  `).join('') : '<p class="small">目前無人上線</p>';

  const active = orders.filter(o => ['pending', 'accepted', 'rejected'].includes(o.status));
  document.getElementById('activeOrders').innerHTML = active.length ? active.map(o => {
    const timedOut = isTimedOut(o);
    return `<div class="order-item ${o.driverId === myDriverId ? 'my-order' : ''}">
      <div>
        <strong>#${o.orderNumber}</strong> → ${o.driverName || '未指派'} ${statusLabel(o)}<br>
        <span class="small">${o.content}</span>
        ${o.note ? `<div class="note">備註：${o.note}</div>` : ''}
        ${o.acceptedAt ? `<br><span class="small">接單時間：${new Date(o.acceptedAt).toLocaleString('zh-TW')}</span>` : ''}
        ${timedOut ? `<br><span class="small" style="color:#d32f2f;">已超過 3 分鐘未接單</span>` : ''}
      </div>
      <div class="flex" style="width:auto;">
        ${o.status === 'accepted' ? `<button class="secondary small-btn" data-action="complete" data-id="${o.id}">完成</button>` : ''}
        ${isOwnerUnlocked && (o.status === 'pending' || o.status === 'rejected' || timedOut) ? `<button class="warning small-btn" data-action="reject" data-id="${o.id}">轉派下一位</button>` : ''}
        ${isOwnerUnlocked ? `<button class="danger small-btn" data-action="cancel" data-id="${o.id}">取消</button>` : ''}
      </div>
    </div>`;
  }).join('') : '<p class="small">無進行中訂單</p>';

  document.getElementById('activeOrders').onclick = (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    const id = btn.dataset.id;
    if (btn.dataset.action === 'complete') completeOrder(id);
    if (btn.dataset.action === 'reject') rejectOrder(id);
    if (btn.dataset.action === 'cancel') cancelOrder(id);
  };

  const completed = orders.filter(o => o.status === 'completed');
  document.getElementById('completedOrders').innerHTML = completed.length ? completed.map(o => `
    <div class="order-item">
      <div>
        <strong>#${o.orderNumber}</strong> → ${o.driverName || '未知'} <span class="completed-tag">已完成</span><br>
        <span class="small">${o.content}</span>
        ${o.note ? `<div class="note">備註：${o.note}</div>` : ''}
        ${o.completedAt ? `<br><span class="small">完成時間：${new Date(o.completedAt).toLocaleString('zh-TW')}</span>` : ''}
      </div>
    </div>
  `).join('') : '<p class="small">尚無已完成訂單</p>';
}

function updateMyButton() {
  const d = drivers.find(x => x.id === myDriverId);
  const btn = document.getElementById('toggleMyStatusBtn');
  if (d) {
    btn.textContent = d.status === 'online' ? '下線' : '上線';
    btn.className = d.status === 'online' ? 'danger' : 'secondary';
  } else {
    btn.textContent = '請先選擇身分';
  }
}

setInterval(render, 10000);
initLiff();
</script>
</body>
</html>
